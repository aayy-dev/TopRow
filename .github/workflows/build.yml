name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so every build uses the same Theos, iOS SDK and AltList as the tested release.
  THEOS_COMMIT: 67db2ab8d950910161730de77c322658ea3e6b44
  SDK_ZIP: https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.3.1-SDKs/iPhoneOS17.3.1.sdk.zip
  SDK_SHA256: 5db95a1a0492a6436d2cd40a0f66cf63f06b6d0a70c9a617ace25feb0dce222d
  ALTLIST_DEB: https://opa334.github.io/debs/com.opa334.altlist_1.0.11_iphoneos-arm64.deb
  ALTLIST_SHA256: 5835a6b0eacd5d99d272b3f74a744b28b1c4c16ada03aade36d0a636bca5e1f0

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          version=$(grep '^Version:' tweak/control | cut -d' ' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Version $version in tweak/control"
            exit 1
          fi

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          THEOS="$RUNNER_TEMP/theos"
          git clone --quiet https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --quiet "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive --quiet
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        # Includes the private frameworks (Preferences) that Xcode's SDK leaves out.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "$SDK_ZIP"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          mkdir -p "$THEOS/sdks"
          mv "$RUNNER_TEMP/sdk/iPhoneOS17.3.1.sdk" "$THEOS/sdks/"

      - name: Install AltList
        run: |
          curl -fsSL -o "$RUNNER_TEMP/altlist.deb" "$ALTLIST_DEB"
          echo "$ALTLIST_SHA256  $RUNNER_TEMP/altlist.deb" | shasum -a 256 -c -
          dpkg-deb -x "$RUNNER_TEMP/altlist.deb" "$RUNNER_TEMP/altlist"
          mkdir -p "$THEOS/lib/iphone/rootless"
          cp -R "$RUNNER_TEMP/altlist/var/jb/Library/Frameworks/AltList.framework" "$THEOS/lib/iphone/rootless/"

      - name: Build
        run: gmake -C tweak package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: TopRow-${{ steps.version.outputs.version }}
          path: tweak/packages/*.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb=$(ls tweak/packages/*.deb)
          {
            awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## /{on=0} on' CHANGELOG.md
            echo
            echo "**Install:** add https://dev.rtrdd.fyi to Sileo or Zebra, or install the .deb below."
            echo "iPhone, rootless jailbreak, iOS 15 or later."
            echo
            echo "SHA-256: \`$(shasum -a 256 "$deb" | cut -d' ' -f1)\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$deb" --title "TopRow $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish to APT repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        run: |
          gh api repos/aayy-dev/aayy-dev.github.io/dispatches \
            -f event_type=publish-deb \
            -F "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
